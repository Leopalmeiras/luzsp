services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radar_eletrico
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_eletrico"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    ports: ["3000:3000"]
    env_file: .env
    volumes: [".:/app", "pnpm_store:/pnpm/store"]
    depends_on:
      postgres: { condition: service_healthy }
volumes: { postgres_data: {}, pnpm_store: {} }
